<header class="print:hidden relative z-50 flex flex-row justify-center w-full h-[80px] bg-[#0a0d29] backdrop-blur md:px-2">
  <a href="#conteudo" class="skip-link">Pular para o conteúdo</a>
  <div class="container flex items-center gap-4">
    <a routerLink="/" class="flex items-center" aria-label="LINEART - página inicial">
      <img class="h-full max-h-[72px] p-2" src="logo.png" alt="Logo LINEART">
    </a>

    <nav class="ml-auto flex items-center gap-4" aria-label="Navegação principal">
      <a routerLink="/sobre" routerLinkActive="text-white font-bold" ariaCurrentWhenActive="page"
        class="hidden lg:block text-sm font-medium text-white/90 hover:text-white py-2">Sobre</a>
      <a routerLink="/mestre" routerLinkActive="text-white font-bold" ariaCurrentWhenActive="page"
        class="hidden lg:block text-sm font-medium text-white/90 hover:text-white py-2">Mestre</a>
      <a routerLink="/publicacoes" routerLinkActive="text-white font-bold" ariaCurrentWhenActive="page"
        class="hidden lg:block text-sm font-medium text-white/90 hover:text-white py-2">Publicações</a>
      <a routerLink="/servicos" routerLinkActive="text-white font-bold" ariaCurrentWhenActive="page"
        class="hidden lg:block text-sm font-medium text-white/90 hover:text-white py-2">Serviços</a>
      <a routerLink="/contato" routerLinkActive="text-white font-bold" ariaCurrentWhenActive="page"
        class="hidden lg:block text-sm font-medium text-white/90 hover:text-white py-2">Contato</a>

      <form class="flex items-center" role="search" (submit)="onSearch($event)">
        <label for="busca-site" class="sr-only">Buscar no site</label>
        <input id="busca-site" type="search" name="q" [(ngModel)]="searchTerm" placeholder="Buscar…"
          class="w-32 sm:w-56 bg-white/10 border border-white/20 text-white placeholder-white/50 text-sm rounded-lg focus:ring-primary-500 focus:border-primary-500 px-3 py-1.5">
      </form>

      <button type="button" (click)="menuOpen = !menuOpen"
        [attr.aria-expanded]="menuOpen" aria-controls="menu-mobile"
        [attr.aria-label]="menuOpen ? 'Fechar menu' : 'Abrir menu'"
        class="lg:hidden inline-flex items-center justify-center w-11 h-11 text-white/90 hover:text-white">
        <svg *ngIf="!menuOpen" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
        <svg *ngIf="menuOpen" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </nav>
  </div>

  <nav *ngIf="menuOpen" id="menu-mobile" aria-label="Menu"
    class="lg:hidden absolute top-[80px] left-0 w-full bg-[#0a0d29] border-t border-white/10 z-40" (click)="menuOpen = false">
    <ul class="flex flex-col">
      <li><a routerLink="/sobre" routerLinkActive="text-white font-bold bg-white/5" class="block py-3.5 px-5 text-base font-medium text-white/90 hover:bg-white/5 border-b border-white/5">Sobre</a></li>
      <li><a routerLink="/mestre" routerLinkActive="text-white font-bold bg-white/5" class="block py-3.5 px-5 text-base font-medium text-white/90 hover:bg-white/5 border-b border-white/5">Mestre</a></li>
      <li><a routerLink="/publicacoes" routerLinkActive="text-white font-bold bg-white/5" class="block py-3.5 px-5 text-base font-medium text-white/90 hover:bg-white/5 border-b border-white/5">Publicações</a></li>
      <li><a routerLink="/servicos" routerLinkActive="text-white font-bold bg-white/5" class="block py-3.5 px-5 text-base font-medium text-white/90 hover:bg-white/5 border-b border-white/5">Serviços</a></li>
      <li><a routerLink="/contato" routerLinkActive="text-white font-bold bg-white/5" class="block py-3.5 px-5 text-base font-medium text-white/90 hover:bg-white/5">Contato</a></li>
    </ul>
  </nav>
</header>
