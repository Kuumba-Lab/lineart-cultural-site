<section class="w-full py-12 bg-slate-50 min-h-[60vh]">
  <div class="container mx-auto px-4 max-w-3xl">

    <a routerLink="/publicacoes" class="text-sm font-semibold text-primary-500 hover:text-primary-300">&larr; Voltar às publicações</a>

    <div *ngIf="isLoading" class="py-16 text-center text-sm text-gray-500">Carregando publicação…</div>

    <div *ngIf="notFound" class="py-16 text-center">
      <p class="text-sm text-gray-500">Publicação não encontrada ou ainda não publicada.</p>
    </div>

    <article *ngIf="post" class="mt-6 bg-white border border-gray-200 rounded-xl overflow-hidden">
      <img *ngIf="post.coverOriginal || post.cover" [src]="post.coverOriginal || post.cover" [alt]="post.title"
        class="w-full max-h-96 object-cover">

      <div class="p-6 md:p-8">
        <div class="flex flex-wrap gap-1 mb-3">
          <span *ngFor="let tag of post.tags" class="px-2 py-0.5 text-xs text-primary-500 bg-primary-100 rounded-full">#{{ tag.name }}</span>
        </div>

        <h1 class="text-2xl md:text-3xl font-bold text-gray-900 leading-tight">{{ post.title }}</h1>

        <p class="mt-3 text-sm text-gray-500">
          {{ authorsLabel() }} · {{ post.createdAt | date:'dd/MM/yyyy' }}
        </p>

        <div class="post-content mt-6 text-gray-800 leading-relaxed" [innerHTML]="post.content"></div>
      </div>
    </article>
  </div>
</section>
