<section id="publicacoes" class="w-full py-12 bg-white">
  <div class="container mx-auto px-4">
    <div class="flex items-end justify-between mb-6">
      <div>
        <p class="text-xs font-semibold uppercase tracking-widest text-primary-500">Blog</p>
        <h2 class="text-2xl md:text-3xl font-bold text-gray-900">Últimas publicações</h2>
      </div>
      <a routerLink="/publicacoes" class="text-sm font-semibold text-primary-500 hover:text-primary-300 whitespace-nowrap">
        Ver mais &rarr;
      </a>
    </div>

    <div *ngIf="isLoading" class="py-10 text-center text-sm text-gray-500">Carregando publicações…</div>

    <div *ngIf="hasError" class="py-10 text-center text-sm text-gray-500">
      Não foi possível carregar as publicações agora.
    </div>

    <div *ngIf="!isLoading && !hasError && !posts.length" class="py-10 text-center text-sm text-gray-500">
      Nenhuma publicação por aqui ainda.
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
      <a *ngFor="let post of posts" [routerLink]="['/publicacoes', post.id]"
        class="group flex flex-col bg-white border border-gray-200 rounded-xl overflow-hidden hover:shadow-lg transition-shadow">
        <div class="h-40 bg-gray-100 overflow-hidden">
          <img *ngIf="post.cover" [src]="post.cover" [alt]="post.title"
            class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
        </div>
        <div class="flex flex-col flex-1 p-4">
          <h3 class="font-semibold text-gray-900 leading-snug line-clamp-2">{{ post.title }}</h3>
          <p class="mt-2 text-sm text-gray-600 line-clamp-3 flex-1">{{ excerpt(post) }}</p>
          <div class="mt-3 flex flex-wrap gap-1">
            <span *ngFor="let tag of post.tags" class="px-2 py-0.5 text-xs text-primary-500 bg-primary-100 rounded-full">#{{ tag.name }}</span>
          </div>
          <div class="mt-3 text-xs text-gray-500">
            {{ authorsLabel(post) }} · {{ post.createdAt | date:'dd/MM/yyyy' }}
          </div>
        </div>
      </a>
    </div>
  </div>
</section>
